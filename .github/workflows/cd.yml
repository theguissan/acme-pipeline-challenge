name: CD

on:
  workflow_call:
    inputs:
      target-environment:
        required: true
        description: Environment to be deployed (staging, prod)
        type: string

jobs:
  provide-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/provide-infra
        with:
         environment: ${{ inputs.target-environment }}

  notify-errors:
    if: failure()
    runs-on: ubuntu-latest
    needs: [provide-infra]
    environment: ${{ inputs.target-environment }}
    steps:
      - uses: ./.github/actions/notify
        with:
          email: team@acme.com
          message: 'Deploy on ${{ inputs.target-environment }} Failed. Please verify here: https://${{ github.repository }}/actions/runs/${{ github.run_id }}'
          title: 'Deploy on ${{ inputs.target-environment }}'