name: Pipeline CI/CD ACME

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:
  develop-pipeline:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/test.yml

  release-pipeline:
    if: github.ref == 'refs/heads/release'
    uses: ./.github/workflows/test.yml
    
  main-pipeline:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml